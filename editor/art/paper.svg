<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Cold-pressed watercolour paper, as a tile: the tooth (lit relief) and a few fibres, laid over the page colour. -->
  <filter id="tooth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="4" seed="9" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="1.6" diffuseConstant="1" lighting-color="#fff" result="l">
      <feDistantLight azimuth="225" elevation="55"/>
    </feDiffuseLighting>
    <feColorMatrix in="l" type="matrix" values="0 0 0 0 .36  0 0 0 0 .29  0 0 0 0 .2  -.16 0 0 0 .15"/>
  </filter>
  <filter id="fibres" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .4  0 0 0 0 .32  0 0 0 0 .24  .16 0 0 0 -.07"/>
  </filter>
  <rect width="360" height="360" filter="url(#tooth)"/>
  <rect width="360" height="360" filter="url(#fibres)"/>
</svg>
